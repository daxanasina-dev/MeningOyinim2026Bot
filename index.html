<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mening 3D O‘yinim</title>
<style>
body{margin:0;background:#101827;color:white;text-align:center;font-family:Arial}
h1{color:#45e6ff}
canvas{background:linear-gradient(#65baff,#d6f5ff);width:95%;max-width:500px;border-radius:12px}
button{padding:15px;margin:8px;border:0;border-radius:10px;background:#00d4ff;font-size:18px}
</style>
</head>
<body>
<h1>🎮 Mening 3D O‘yinim</h1>
<p>Yulduzlarni yig‘ing!</p>
<canvas id="game" width="360" height="480"></canvas>
<br>
<button onclick="move(-25)">⬅️</button>
<button onclick="move(25)">➡️</button>
<p>Ball: <span id="score">0</span></p>
<script>
const c=document.getElementById('game');
const x=c.getContext('2d');
let player=180,starX=100,starY=0,score=0;
function move(n){player=Math.max(20,Math.min(340,player+n));}
function draw(){
x.clearRect(0,0,360,480);
x.fillStyle='#16833d';x.fillRect(0,420,360,60);
x.fillStyle='#ff3434';x.fillRect(player-15,390,30,30);
x.fillStyle='#ffd700';x.font='28px Arial';x.fillText('⭐',starX,starY);
starY+=3;
if(starY>420){starY=0;starX=20+Math.random()*320;score++;document.getElementById('score').textContent=score;}
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>```
